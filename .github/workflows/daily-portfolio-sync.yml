name: Daily portfolio discovery and publish

on:
  push:
    branches: [main]
  schedule:
    # 08:17 Asia/Ho_Chi_Minh (GitHub cron uses UTC).
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: portfolio-publish
  cancel-in-progress: false

jobs:
  scan-build:
    name: Discover, validate and prepare site
    runs-on: ubuntu-latest
    outputs:
      new_projects: ${{ steps.scan.outputs.new_projects }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Discover eligible repositories
        id: scan
        if: github.event_name != 'push'
        env:
          PORTFOLIO_SYNC_TOKEN: ${{ secrets.PORTFOLIO_SYNC_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/sync_repos.py --owner hungtranbkit --apply | tee /tmp/portfolio-sync.log
          python3 - <<'PY'
          import os, re
          content = open("/tmp/portfolio-sync.log", encoding="utf-8").read()
          match = re.search(r"discovered=(\d+)", content)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("new_projects=" + (match.group(1) if match else "0") + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Portfolio daily repository scan\n\n")
              summary.write("~~~text\n" + content + "\n~~~\n")
          PY

      - name: Validate catalog and safety policy
        run: |
          python3 -m unittest discover -s scripts -p 'test_repo_sync.py' -v
          python3 scripts/check_site.py
          node --check assets/app.js

      - name: Commit additions without overwriting curated entries
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json sitemap.xml projects/
          if git diff --cached --quiet; then
            echo "No eligible new projects."
          else
            git commit -m "content: daily discovery of new portfolio projects"
            git push origin HEAD:main
          fi

      - name: Generate public-only site artifact
        run: python3 scripts/build_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    name: Deploy portfolio
    needs: scan-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
